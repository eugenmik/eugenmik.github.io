- title: "A Faster First Look at Casting Solidification"
  outlet: "Foundry Management & Technology"
  date: "Sep 2026"
  url: "https://www.foundrymag.com/simulation-it/media-gallery/55399966/a-faster-first-look-at-casting-solidification-technical-development"
  abstract: "Describes the graph neural network in FoundryFlash. It takes a STEP model and casting conditions and estimates solidification time and local thermal modulus at every mesh node, shown in the browser with section planes. Compared with FEniCSx reference simulations on a 12,373-node mesh, the mean absolute error was 44.7 s, and the final solidification time came out about 15.1% short."
- title: "Certainty in the Early Design Stages of Foundry Engineering"
  outlet: "Foundry-Planet"
  date: "Sep 2026"
  url: "https://www.foundry-planet.com/d/certainty-in-the-early-design-stages-of-foundry-engineering-1/"
  abstract: "Shows how a browser tool can screen solidification early in design: upload a STEP model, mesh it and compare feeding concepts before running a full process simulation. The example is a G20Mn5 pump casting with 12,373 mesh nodes and a predicted solidification time of 423 s. Steels and cast irons are supported."
