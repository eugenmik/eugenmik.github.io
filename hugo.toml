baseURL = "https://eugenmik.github.io/"
languageCode = "en-us"
title = "Eugen Miknevic"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  author = "Eugen Miknevic"
  description = "Foundry engineer with 20 years in casting who builds physics-based AI and software tools for foundries and metallurgy."
  defaultTheme = "auto"
  mainSections = ["posts"]
  images = ["images/og-default.jpg"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  heroPhoto = "images/eugen-miknevic.jpg"
  headline = "AI Engineer for Casting & Manufacturing Simulation"
  subline = "Foundry engineer, working in casting since 2006. I learned modern AI to use it together with that experience, and I develop software tools for foundries and metallurgy."
  email = "eugenmiknevic@gmail.com"

  [params.footer]
    text = "[About](/about/) · [Search](/search/) · [Legal & Privacy](/legal/)"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/eugenmiknevic"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/eugenmik"
  [[params.socialIcons]]
    name = "huggingface"
    title = "Hugging Face"
    url = "https://huggingface.co/eugenmik"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:eugenmiknevic@gmail.com"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    keys = ["title", "summary", "content"]

[[menu.main]]
  name = "Writing"
  url = "/posts/"
  weight = 10
[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 20
[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 30
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 40

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["\\[", "\\]"], ["$$", "$$"]]
    inline = [["\\(", "\\)"]]

[markup.goldmark.extensions.typographer]
  disable = true

[markup.highlight]
  noClasses = false
