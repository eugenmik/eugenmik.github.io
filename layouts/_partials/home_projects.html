{{- /* Only projects marked featured: true; all projects are on /projects/ */}}
{{- with where (where site.RegularPages "Section" "projects") "Params.featured" true }}
<section class="home-section">
  <h2>My projects</h2>
  <div class="project-grid">
    {{- range .ByWeight }}{{ partial "project_card.html" . }}{{ end }}
  </div>
  <p class="more"><a href="{{ "projects/" | relURL }}">All projects</a></p>
</section>
{{- end }}
