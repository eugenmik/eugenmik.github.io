{{- $src := .Get "src" -}}
<figure class="post-video">
  <video autoplay muted loop playsinline preload="metadata"
    poster="{{ printf "media/%s-poster.jpg" $src | relURL }}"
    aria-label="{{ .Get "alt" }}">
    <source src="{{ printf "media/%s.mp4" $src | relURL }}" type="video/mp4">
  </video>
  {{- with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
